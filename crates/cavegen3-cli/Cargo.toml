[package]
name = "cavegen3-cli"
version = "0.1.0"
description = "CaveGen3 on the command line: writes cave layouts as PNG images"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "cavegen3"
path = "src/main.rs"

[dependencies]
cavegen3 = { path = "../cavegen3" }
cavegen3-web = { path = "../cavegen3-web" }
clap = { version = "4.5", features = ["derive"] }
fontdue = "0.8"
rayon = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.11"
