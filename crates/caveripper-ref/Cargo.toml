[package]
name = "caveripper-ref"
publish = false
description = "Caveripper's library, kept as a test reference for CaveGen3"
license = "MIT"
version = "0.1.0"
edition = "2024"

[lib]
# Keeps the original crate name so ported tests and code read the same.
name = "caveripper"

[features]
wasm = []

[dependencies]
pest = "2.5"
pest_derive = "2.5"
encoding_rs = "0.8"
itertools = "0.12"
regex = "1.8"
image = "0.24"
log = "0.4"
clap = {version="4.0", features=["derive"]}
thiserror = "1.0"
fontdue = "0.8"
rand = {version="0.8", features=["small_rng"]}
rayon = "1.6"
serde = {version="1.0", features=["derive"]}
error-stack = "0.4"
float-ord = "0.3"
petgraph = "0.6"
num = "0.4"
dirs = "5.0"
fs_extra = "1.3"
chrono = {version="0.4", features=["clock"]}
auto_impl = "1.1.0"

[dev-dependencies]
paste = "1.0"
flate2 = "1.0"
