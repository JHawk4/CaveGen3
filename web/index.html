<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaveGen3</title>
<meta name="description" content="Generate Pikmin 2 cave layouts from a seed, in your browser.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>CaveGen3</h1>
  <p>Pikmin 2 cave layouts for any seed, generated in your browser.</p>
</header>

<main>
  <form id="controls" class="controls" autocomplete="off">
    <label class="field">
      <span>Game</span>
      <select id="game"></select>
    </label>
    <label class="field grow">
      <span>Cave</span>
      <select id="cave"></select>
    </label>
    <label class="field">
      <span>Sublevel</span>
      <select id="floor"></select>
    </label>
    <label class="field">
      <span>Seed</span>
      <span class="seed-row">
        <button type="button" id="prev" class="icon-btn" title="Previous seed" aria-label="Previous seed">&lsaquo;</button>
        <input id="seed" inputmode="text" spellcheck="false" maxlength="10" pattern="(0x)?[0-9A-Fa-f]{1,8}" title="Up to 8 hex digits" required>
        <button type="button" id="next" class="icon-btn" title="Next seed" aria-label="Next seed">&rsaquo;</button>
      </span>
    </label>
    <div class="buttons">
      <button type="button" id="random">Random seed</button>
      <button type="submit" id="go" class="primary">Generate</button>
    </div>
  </form>

  <div id="status" class="status" role="status" aria-live="polite">Loading&hellip;</div>

  <section class="result" id="result" hidden>
    <div class="map-wrap">
      <div class="map-toolbar">
        <span id="title" class="map-title"></span>
        <span class="spacer"></span>
        <label class="check"><input type="checkbox" id="water" checked> Water</label>
        <label class="zoom">Zoom
          <select id="zoom">
            <option value="fit" selected>Fit</option>
            <option value="0.5">50%</option>
            <option value="1">100%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
        </label>
        <button type="button" id="copy-link">Copy link</button>
        <button type="button" id="download">Save image</button>
      </div>
      <div class="map-scroll" id="map-scroll">
        <canvas id="map" aria-label="Cave layout"></canvas>
      </div>
    </div>
    <aside class="summary" id="summary"></aside>
  </section>
</main>

<footer class="site-footer">
  <p>
    CaveGen3's layouts are checked against
    <a href="https://github.com/JHawk4/CaveGen">CaveGen</a> and
    <a href="https://github.com/mayabyte/caveripper">Caveripper</a>.
    <a href="https://github.com/JHawk4/CaveGen3">Source</a>.
    Pikmin 2 is &copy; Nintendo; romhack data belongs to its authors.
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
