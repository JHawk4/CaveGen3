<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
</head>
<body data-page="suggest">
<header class="site-header">
  <div class="title-row">
    <h1 class="logo"><a href="./"><svg viewBox="0 0 24 34" width="26" height="37" aria-hidden="true"><path d="M12 33 C12 26 11.6 20 12 13" stroke="#3c8531" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M12 25 C8.5 25.5 5 23.5 3.6 20.6 C7.4 19.6 10.6 21.5 12 25 Z" fill="#5fb447" stroke="#3c8531" stroke-width="1"/><ellipse cx="12.00" cy="4.40" rx="3.1" ry="4.3" transform="rotate(0 12.00 4.40)" fill="#ffffff" stroke="#c9c2d6" stroke-width="0.8"/><ellipse cx="16.37" cy="7.58" rx="3.1" ry="4.3" transform="rotate(72 16.37 7.58)" fill="#ffffff" stroke="#c9c2d6" stroke-width="0.8"/><ellipse cx="14.70" cy="12.72" rx="3.1" ry="4.3" transform="rotate(144 14.70 12.72)" fill="#ffffff" stroke="#c9c2d6" stroke-width="0.8"/><ellipse cx="9.30" cy="12.72" rx="3.1" ry="4.3" transform="rotate(216 9.30 12.72)" fill="#ffffff" stroke="#c9c2d6" stroke-width="0.8"/><ellipse cx="7.63" cy="7.58" rx="3.1" ry="4.3" transform="rotate(288 7.63 7.58)" fill="#ffffff" stroke="#c9c2d6" stroke-width="0.8"/><circle cx="12" cy="9" r="3.1" fill="#f2c230" stroke="#d39a12" stroke-width="0.9"/></svg>CaveGen3</a></h1>
    <nav class="site-nav">
      <a href="./" data-i18n="navGenerator">Generator</a>
      <a href="aggregator.html" data-i18n="navAggregator">Aggregator</a>
      <a href="suggest.html" class="nav-suggest" aria-current="page" data-i18n="navSuggest">Suggestion box</a>
    </nav>
    <button type="button" id="lang-toggle" class="lang-toggle">日本語</button>
  </div>
</header>

<main class="narrow">
  <h2 data-i18n="suggestTitle">Suggestion box</h2>
  <p data-i18n="suggestIntro"></p>
  <!-- The same Google Form as the other Pikmin sites; "page" tells them apart. -->
  <form id="suggest" class="suggest"
        action="https://docs.google.com/forms/d/e/1FAIpQLSepPb6F7_Y6DlLoHn-nqpy2KG3BqaMLfDLAdArL9B5iyEt_LA/formResponse"
        method="POST">
    <label class="field"><span data-i18n="suggestName">Name (optional)</span>
      <input name="entry.1125475916" maxlength="80" data-i18n-placeholder="suggestNamePlaceholder">
    </label>
    <label class="field"><span data-i18n="suggestMessage">Suggestion</span>
      <textarea name="entry.1148029577" rows="7" maxlength="4000" required></textarea>
    </label>
    <label class="field"><span data-i18n="suggestContact">Contact (optional)</span>
      <input name="entry.303778019" maxlength="120" data-i18n-placeholder="suggestContactPlaceholder">
    </label>
    <input type="hidden" name="entry.1626566187" id="suggest-page">
    <div class="buttons">
      <button type="submit" class="primary" data-i18n="suggestSend">Send</button>
      <span id="suggest-status" class="status" role="status" aria-live="polite"></span>
    </div>
  </form>
</main>

<footer class="site-footer">
  <p id="footer-text"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
