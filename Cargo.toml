[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/JHawk4/CaveGen3"

[profile.release]
lto = "fat"
codegen-units = 1

# Tests generate thousands of layouts, so build them optimized too.
[profile.test]
opt-level = 3
